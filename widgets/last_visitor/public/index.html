<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { margin: 0; height: 100%; }
    .frame { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
    img { width: 100%; height: 100%; object-fit: cover; }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    img { display: none; }
    .caption {
      position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 12px;
      background: rgba(0, 0, 0, 0.45); color: #fff; font-size: 14px; display: none;
    }
    .play {
      position: absolute; top: 50%; left: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px;
      border: 0; border-radius: 50%; background: rgba(0, 0, 0, 0.55); color: #fff;
      font-size: 24px; line-height: 56px; text-align: center; display: none; cursor: pointer;
    }
    .empty {
      display: flex; align-items: center; justify-content: center; height: 100%;
      background: var(--homey-background-color, #fff);
      color: var(--homey-text-color-light, #888); font-size: 14px; text-align: center; padding: 0 16px;
    }
  </style>
</head>
<body class="homey-widget-full">
  <div class="frame" id="frame">
    <img id="photo" alt="" />
    <div class="caption" id="caption"></div>
    <button class="play" id="play" aria-label="Play">&#9654;</button>
    <div class="empty" id="empty"></div>
  </div>

  <script type="text/javascript">
    function onHomeyReady(Homey) {
      Homey.ready();

      const lang = (navigator.language || 'en').toLowerCase().startsWith('nl') ? 'nl' : 'en';
      const T = {
        en: { empty: 'No visitor yet', last: 'Last visitor', lastAt: 'Last visitor: ',
              unavailable: 'Video not available', failed: 'Video could not be played', play: 'Play video' },
        nl: { empty: 'Nog geen bezoeker gezien', last: 'Laatste bezoeker', lastAt: 'Laatste bezoeker: ',
              unavailable: 'Video niet beschikbaar', failed: 'Video kon niet worden afgespeeld', play: 'Video afspelen' },
      }[lang];

      const frame = document.getElementById('frame');
      const photo = document.getElementById('photo');
      const caption = document.getElementById('caption');
      const play = document.getElementById('play');
      const empty = document.getElementById('empty');
      empty.textContent = T.empty;
      play.setAttribute('aria-label', T.play);
      let lastTime = null;
      let playing = false;
      let lastRatio = null;

      // Match the widget shape to the photo (portrait or landscape).
      // A percentage height is an aspect ratio: 133% = 3:4 portrait.
      photo.addEventListener('load', () => {
        if (!photo.naturalWidth) return;
        const ratio = Math.min(2, Math.max(0.6, photo.naturalHeight / photo.naturalWidth));
        const percent = Math.round(ratio * 100);
        if (percent === lastRatio) return;
        lastRatio = percent;
        Promise.resolve(Homey.setHeight(percent + '%')).catch(console.error);
      });

      function formatTime(iso) {
        const date = new Date(iso);
        if (isNaN(date)) return '';
        return date.toLocaleString(navigator.language || 'en', {
          day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit',
        });
      }

      async function load() {
        if (playing) return; // don't interrupt a playing video
        try {
          const result = await Homey.api('GET', '/', {});
          if (!result || !result.dataUrl) return;
          if (result.time !== lastTime) {
            lastTime = result.time;
            photo.src = result.dataUrl;
          }
          const when = formatTime(result.time);
          const label = result.species || T.last;
          caption.textContent = when ? label + ': ' + when : label;
          photo.style.display = 'block';
          caption.style.display = 'block';
          play.style.display = result.hasVideo ? 'block' : 'none';
          empty.style.display = 'none';
        } catch (err) {
          console.error(err);
        }
      }

      play.addEventListener('click', async () => {
        play.disabled = true;
        try {
          const result = await Homey.api('GET', '/video', {});
          if (!result || !result.url) {
            caption.textContent = T.unavailable;
            play.style.display = 'none';
            return;
          }
          playing = true;
          const video = document.createElement('video');
          video.src = result.url;
          video.controls = true;
          video.autoplay = true;
          video.playsInline = true;
          video.addEventListener('ended', () => {
            playing = false;
            video.remove();
            load();
          });
          video.addEventListener('error', () => {
            playing = false;
            video.remove();
            caption.textContent = T.failed;
          });
          photo.style.display = 'none';
          caption.style.display = 'none';
          play.style.display = 'none';
          frame.appendChild(video);
        } catch (err) {
          console.error(err);
        } finally {
          play.disabled = false;
        }
      });

      load();
      setInterval(load, 60 * 1000);
    }
  </script>
</body>
</html>
